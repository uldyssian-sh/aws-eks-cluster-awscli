apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enterprise-network-policy
spec:
  podSelector:
    matchLabels:
      app: enterprise-app
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          role: frontend
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - podSelector:
        matchLabels:
          role: database
    ports:
    - protocol: TCP
      port: 5432
