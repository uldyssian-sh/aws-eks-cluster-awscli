name: Test Scripts
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test script syntax
        run: |
          if [ -d "scripts" ]; then
            for script in scripts/*.sh; do
              if [ -f "$script" ]; then
                echo "Testing $script"
                bash -n "$script"
              fi
            done
          fi

      - name: Run test suite
        run: |
          if [ -f "tests/test.sh" ]; then
            chmod +x tests/test.sh
            ./tests/test.sh
          else
            echo "No test suite found, skipping"
          fi
