name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Validate Shell Scripts
      run: |
        set -e
        if command -v shellcheck >/dev/null 2>&1; then
          find . -name "*.sh" -exec shellcheck {} \;
        else
          echo "Warning: shellcheck not available"
        fi
    
    - name: Validate YAML Files
      run: |
        set -e
        if command -v yamllint >/dev/null 2>&1; then
          find . -name "*.yml" -o -name "*.yaml" -print0 | xargs -0 yamllint
        else
          echo "Warning: yamllint not available"
        fi
    
    - name: Security Scan
      uses: github/super-linter@v5
      env:
        DEFAULT_BRANCH: main
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    needs: validate
    steps:
    - uses: actions/checkout@v4
    
    - name: Test EKS Scripts
      run: |
        # Dry run tests
        if [ -f scripts/validate-config.sh ]; then
          bash scripts/validate-config.sh --dry-run
        else
          echo "Warning: scripts/validate-config.sh not found"
        fi
    
    - name: Integration Tests
      run: |
        # Mock AWS CLI tests
        echo "Running integration tests..."

  release:
    runs-on: ubuntu-latest
    needs: [validate, test]
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
    
    - name: Generate Release Notes
      id: release_notes
      run: |
        echo "Automated release from CI/CD pipeline" > release_notes.txt
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        body_path: release_notes.txt