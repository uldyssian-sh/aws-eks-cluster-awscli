name: Validation
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Validate Repository Structure
      run: |
        echo "Validating repository structure..."
        if [ ! -d scripts ]; then echo "❌ Scripts directory missing" && exit 1; fi
        if [ ! -d manifests ]; then echo "❌ Manifests directory missing" && exit 1; fi
        if [ ! -d terraform ]; then echo "❌ Terraform directory missing" && exit 1; fi
        echo "✓ Scripts directory found"
        echo "✓ Manifests directory found"
        echo "✓ Terraform directory found"
        echo "✓ Validation completed successfully"
