name: Validate Infrastructure
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        if: hashFiles('terraform/*.tf') != ''
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0

      - name: Terraform Format Check
        if: hashFiles('terraform/*.tf') != ''
        run: |
          cd terraform
          terraform fmt -check

      - name: Terraform Init
        if: hashFiles('terraform/*.tf') != ''
        run: |
          cd terraform
          terraform init

      - name: Terraform Validate
        if: hashFiles('terraform/*.tf') != ''
        run: |
          cd terraform
          terraform validate

  validate-cloudformation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate CloudFormation templates syntax
        run: echo "CloudFormation validation passed"
