name: Validate Infrastructure
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Terraform
        if: hashFiles('terraform/*.tf') != ''
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0
          
      - name: Terraform Format Check
        if: hashFiles('terraform/*.tf') != ''
        run: |
          cd terraform
          terraform fmt -check
          
      - name: Terraform Init
        if: hashFiles('terraform/*.tf') != ''
        run: |
          cd terraform
          terraform init
          
      - name: Terraform Validate
        if: hashFiles('terraform/*.tf') != ''
        run: |
          cd terraform
          terraform validate
          
  validate-cloudformation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          aws-access-key-id: fake
          aws-secret-access-key: fake
          
      - name: Validate CloudFormation templates
        run: |
          if [ -d "cloudformation" ]; then
            for template in cloudformation/*.yaml cloudformation/*.yml; do
              if [ -f "$template" ]; then
                echo "Validating $template"
                aws cloudformation validate-template --template-body file://$template || echo "Validation failed for $template"
              fi
            done
          else
            echo "No CloudFormation templates found"
          fi
