# DEPRECATED: PodSecurityPolicy is deprecated in Kubernetes 1.21+ and removed in 1.25+
# Use Pod Security Standards instead: https://kubernetes.io/docs/concepts/security/pod-security-standards/
# This file is kept for reference but should not be applied to clusters running Kubernetes 1.25+
# WARNING: PodSecurityPolicy is DEPRECATED and removed in Kubernetes 1.25+
# This configuration will FAIL on Kubernetes 1.25+ clusters
# 
# MIGRATION REQUIRED: Use Pod Security Standards instead:
# kubectl label namespace <namespace> pod-security.kubernetes.io/enforce=restricted
# kubectl label namespace <namespace> pod-security.kubernetes.io/audit=restricted
# kubectl label namespace <namespace> pod-security.kubernetes.io/warn=restricted
#
# Before upgrading to Kubernetes 1.25+, remove this file and implement
# Pod Security Standards to maintain security policies

apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: restricted
  annotations:
    deprecated: "true"
    migration-guide: "Use Pod Security Standards with namespace labels"
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
    - ALL
  volumes:
    - 'configMap'
    - 'emptyDir'
    - 'projected'
    - 'secret'
    - 'downwardAPI'
    - 'persistentVolumeClaim'
  runAsUser:
    rule: 'MustRunAsNonRoot'
  seLinux:
    rule: 'RunAsAny'
  fsGroup:
    rule: 'RunAsAny'
  readOnlyRootFilesystem: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: restricted-psp-user
rules:
  - apiGroups: ['policy']
    resources: ['podsecuritypolicies']
    verbs: ['use']
    resourceNames:
      - restricted
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: restricted-psp-all-serviceaccounts
subjects:
  - kind: Group
    name: system:serviceaccounts
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: restricted-psp-user
  apiGroup: rbac.authorization.k8s.io
