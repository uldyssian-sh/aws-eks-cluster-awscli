# Pod Security Standards - Modern replacement for deprecated PodSecurityPolicy
# This configuration uses Pod Security Standards which are available in Kubernetes 1.23+
# and are the recommended approach for pod security enforcement

# Create a restricted namespace for applications requiring strict security
apiVersion: v1
kind: Namespace
metadata:
  name: restricted-apps
  labels:
    # Enforce restricted Pod Security Standard
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    # Use latest version of the standard
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn-version: latest
---
# Create a baseline namespace for less restrictive applications
apiVersion: v1
kind: Namespace
metadata:
  name: baseline-apps
  labels:
    # Enforce baseline Pod Security Standard
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn-version: latest
---
# NetworkPolicy to restrict traffic between namespaces
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-cross-namespace
  namespace: restricted-apps
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: restricted-apps
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: restricted-apps
  - to: []
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53